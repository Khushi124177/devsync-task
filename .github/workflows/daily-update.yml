name: Daily Repository Update

on:
  schedule:
    - cron: '17 4 * * *'   # Runs daily at 04:17 UTC (specific time, no wildcards)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Step by 24f2004980@ds.study.iitm.ac.in
        run: echo "Last run: $(date)" >> daily_log.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add daily_log.txt
          git commit -m "Daily automated commit"
          git push
