name: Daily Repository Update

on:
  schedule:
    - cron: '12 3 * * *'   # Runs daily at 03:12 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Step by 24f2004980@ds.study.iitm.ac.in
        run: |
          echo "Run time: $(date)" > daily_log.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add daily_log.txt
          git commit -m "Daily automated commit" || echo "No changes"
          git push
